name: Patch zero-config Users
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-zero-config-users.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/Services/UserManager.php')
          s=p.read_text()
          imp='use Tihloh\\Prefab\\Users\\User\\PrefabUser;'
          add=imp+'\nuse Tihloh\\Prefab\\Users\\Support\\DefaultUserStorage;'
          if 'Support\\DefaultUserStorage' not in s:
              s=s.replace(imp,add)
          old='''    private function provider(): UserProviderInterface\n    {\n        if (!$this->provider) {\n            throw new RuntimeException(\n                'Prefab Users needs a provider or database capability/configuration.',\n            );\n        }\n\n        return $this->provider;\n    }'''
          new='''    private function provider(): UserProviderInterface\n    {\n        if (!$this->provider) {\n            $this->prefabConfigure();\n        }\n\n        if (!$this->provider) {\n            $this->provider = DefaultUserStorage::provider($this->config);\n            PrefabRuntime::recordResolution(\n                'users',\n                'user_provider',\n                'automatic-sqlite-fallback',\n                [\n                    'provider' => $this->provider::class,\n                    'path' => DefaultUserStorage::path($this->config),\n                    'table' => (string) ($this->config['table'] ?? 'users'),\n                ],\n            );\n            PrefabRuntime::provide('user_provider', $this->provider, 'prefab-users');\n        }\n\n        return $this->provider;\n    }'''
          if old not in s:
              raise SystemExit('provider block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Services/UserManager.php
          git commit -m 'Make Prefab Users work without database initialization'
          git push
