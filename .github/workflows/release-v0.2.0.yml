name: Release Prefab Users v0.2.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.2.0.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          TARGET=$(git rev-parse HEAD^)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.2.0 "$TARGET" -m 'Prefab Users v0.2.0'
          git push origin v0.2.0
          gh release create v0.2.0 --title 'Prefab Users v0.2.0' --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
